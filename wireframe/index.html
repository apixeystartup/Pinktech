<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Complete interactive wireframe inventory for the Pinktech SaaS application.">
    <title>Pinktech — Complete product wireframe</title>
    <link rel="stylesheet" href="./wireframe.css">
    <script src="./wireframe.js" defer></script>
  </head>
  <body>
    <div class="wf-app" id="wireframe">
      <header class="wf-topbar">
        <a class="wf-brand" href="#dashboard" aria-label="Pinktech wireframe home">
          <span class="wf-brand-mark" aria-hidden="true">P</span>
          <span><strong>Pinktech</strong><small>Product wireframe</small></span>
        </a>
        <div class="wf-global">
          <label class="wf-tenant-picker">
            <span>Tenant</span>
            <select id="tenant-scope">
              <option>Home · all tenants</option>
              <option>Apixey Private Limited</option>
              <option>Northstar Health</option>
            </select>
          </label>
          <label class="wf-role-picker">
            <span>Preview as</span>
            <select id="persona">
              <option value="super-admin">Super admin</option>
              <option value="tenant-admin">Tenant admin</option>
              <option value="employee">Employee / approver</option>
              <option value="doctor">External doctor</option>
            </select>
          </label>
          <label class="wf-search">
            <span class="wf-sr-only">Find a screen</span>
            <input id="screen-search" type="search" placeholder="Find a screen…">
            <kbd>/</kbd>
          </label>
          <div class="wf-account"><span class="wf-account-mark">SA</span><span><strong>Platform Admin</strong><small>admin@pinktech.test</small></span></div>
          <button class="wf-logout" type="button" data-toast="Log out is represented in this wireframe.">Log out</button>
          <button class="wf-menu-toggle" id="menu-toggle" type="button" aria-label="Open screen navigation" aria-expanded="false">Screens</button>
        </div>
      </header>
      <div class="wf-layout">
        <aside class="wf-sidebar" id="screen-sidebar" aria-label="Wireframe screens">
          <div class="wf-sidebar-intro">
            <p class="wf-overline">Pinktech workspace</p>
            <p>Browse the complete screen inventory. Controls are representative and do not save data.</p>
          </div>
          <nav id="screen-nav"></nav>
          <div class="wf-sidebar-foot">
            <span class="wf-status-dot"></span>
            <span>Wireframe prototype</span>
            <span class="wf-version">v1</span>
          </div>
        </aside>
        <main class="wf-main" id="screen-content" tabindex="-1">
          <div class="wf-loading">Loading wireframe screens…</div>
        </main>
      </div>
    </div>
    <div class="wf-toast" id="wireframe-toast" role="status" aria-live="polite"></div>
  </body>
</html>
